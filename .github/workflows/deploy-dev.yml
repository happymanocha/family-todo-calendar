name: Deploy to Development

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'
  AWS_REGION: us-east-1

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint
        continue-on-error: true

      - name: Run unit tests
        run: npm run test:unit
        continue-on-error: true

      - name: Run integration tests
        run: npm run test:integration
        continue-on-error: true

      - name: Security scan
        run: npm run security:scan
        continue-on-error: true

      - name: Check code coverage
        run: npm run test:coverage
        continue-on-error: true
        env:
          COVERAGE_THRESHOLD: 70

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  deploy:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: development
      url: http://nest-family-organizer-website-dev.s3-website-us-east-1.amazonaws.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Serverless Framework
        run: npm install -g serverless@3

      - name: Deploy to AWS
        run: serverless deploy --stage dev --verbose
        env:
          JWT_SECRET: ${{ secrets.DEV_JWT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Get deployment info
        id: deploy-info
        run: |
          API_URL=$(serverless info --stage dev 2>&1 | grep -o 'https://[^/]*' | head -1 || echo "")
          echo "api_url=${API_URL}" >> $GITHUB_OUTPUT
          echo "website_url=http://nest-family-organizer-website-dev.s3-website-us-east-1.amazonaws.com" >> $GITHUB_OUTPUT
          echo "Captured API URL: ${API_URL}"

      - name: Run smoke tests
        continue-on-error: true
        run: |
          API_URL="${{ steps.deploy-info.outputs.api_url }}"
          if [ -n "$API_URL" ]; then
            echo "Running smoke tests against ${API_URL}"
            curl -f "${API_URL}/api/health" || echo "⚠️ Health check failed (non-critical)"
          else
            echo "⚠️ API URL not found - skipping smoke tests"
            echo "This is expected for first deployment"
          fi

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Development deployment successful!"
            echo "🌐 Website: ${{ steps.deploy-info.outputs.website_url }}"
            echo "🔌 API: ${{ steps.deploy-info.outputs.api_url }}"
          else
            echo "❌ Development deployment failed!"
          fi
